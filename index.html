<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Takip</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: #e5e3df;
        }
        .panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 280px;
        }
        .badge {
            display: block;
            padding: 5px 8px;
            border-radius: 5px;
            background: #e0e0e0;
            font-weight: bold;
            margin-top: 5px;
            font-size: 12px;
        }
        .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 8px;
        }
        .q-btn {
            background: #e9ecef;
            border: 1px solid #ced4da;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .sos-btn {
            width: 100%;
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel">
        <h4 id="status" style="margin: 0 0 5px 0; color: #d9534f;">GPS İzni Bekleniyor...</h4>
        <div id="my-battery" class="badge">Piliniz: %--</div>
        <div id="my-speed" class="badge" style="background: #e3f2fd; color: #1565c0;">Hızınız: 0 km/s</div>
        <div id="partner-info" class="badge" style="background: #4caf50; color: white; display: none;">Karşı Taraf: Bekleniyor...</div>
        
        <div class="quick-grid">
            <button class="q-btn" onclick="sendMsg('Yoldayım 🚗')">Yoldayım 🚗</button>
            <button class="q-btn" onclick="sendMsg('5 dk\'ya oradayım ⏱️')">5 dk'ya oradayım ⏱️</button>
            <button class="q-btn" onclick="sendMsg('Eve varıyorum 🏠')">Eve varıyorum 🏠</button>
            <button class="q-btn" onclick="sendMsg('Yemekteyim 🍕')">Yemekteyim 🍕</button>
        </div>

        <div style="margin-top: 8px; border-top: 1px solid #ddd; padding-top: 6px;">
            <div id="chat-box" style="max-height: 45px; overflow-y: auto; font-size: 11px; background: #f9f9f9; padding: 4px; border-radius: 4px; margin-bottom: 5px;">Sohbet boş...</div>
            <div style="display: flex; gap: 4px;">
                <input type="text" id="msg-input" placeholder="Mesaj..." style="flex: 1; padding: 4px; font-size: 11px; border: 1px solid #ccc; border-radius: 3px;">
                <button onclick="sendChat()" style="padding: 4px 8px; background: #007bff; color: white; border: none; border-radius: 3px; font-size: 11px; cursor: pointer;">Gönder</button>
            </div>
        </div>

        <button class="sos-btn" onclick="triggerSOS()">🚨 SOS ACİL DURUM</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const socket = io();
        const statusEl = document.getElementById('status');
        const myBatteryEl = document.getElementById('my-battery');
        const mySpeedEl = document.getElementById('my-speed');
        const partnerInfoEl = document.getElementById('partner-info');
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');

        // Haritayı Türkiye merkezli varsayılan başlat (İzin verilmeden de görünsün)
        const map = L.map('map', { zoomControl: false }).setView([39.9207, 32.8541], 6);
        
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Ekran boyutunu sürekli yenile
        function refreshMap() {
            map.invalidateSize();
        }
        setInterval(refreshMap, 1000);

        let myMarker = null;
        let partnerMarker = null;

        // Pil Durumu
        if (navigator.getBattery) {
            navigator.getBattery().then(bat => {
                const updateBat = () => { myBatteryEl.innerText = "Piliniz: " + Math.round(bat.level * 100) + "%" + (bat.charging ? " ⚡" : ""); };
                updateBat();
                bat.addEventListener('levelchange', updateBat);
            });
        }

        // Konum Takibi
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;

                statusEl.innerText = "Canlı Takip Aktif 🟢";
                statusEl.style.color = "#28a745";
                mySpeedEl.innerText = "Hızınız: " + speed + " km/s";

                if (!myMarker) {
                    myMarker = L.marker([lat, lng]).addTo(map).bindPopup("Siz").openPopup();
                    map.setView([lat, lng], 15);
                } else {
                    myMarker.setLatLng([lat, lng]);
                }

                socket.emit('share-location', { lat, lng, speed });
            }, err => {
                statusEl.innerText = "GPS İzni Verilmedi!";
                statusEl.style.color = "#dc3545";
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
        }

        socket.on('update-location', data => {
            partnerInfoEl.style.display = "block";
            partnerInfoEl.innerText = `Karşı Taraf | Hız: ${data.speed || 0} km/s`;

            if (partnerMarker) {
                partnerMarker.setLatLng([data.lat, data.lng]);
            } else {
                partnerMarker = L.marker([data.lat, data.lng]).addTo(map).bindPopup("Karşı Taraf");
            }
        });

        function sendMsg(txt) {
            socket.emit('send-message', txt);
            chatBox.innerHTML += `<div><b>Sen:</b> ${txt}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendChat() {
            const txt = msgInput.value.trim();
            if (!txt) return;
            sendMsg(txt);
            msgInput.value = "";
        }

        socket.on('receive-message', txt => {
            chatBox.innerHTML += `<div><b>O:</b> ${txt}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        function triggerSOS() {
            if (confirm("SOS sinyali gönderilsin mi?")) {
                socket.emit('send-sos');
                alert("SOS Gönderildi!");
            }
        }

        socket.on('receive-sos', () => {
            alert("🚨 KARŞI TARAFTAN ACİL SOS SİNYALİ GELDİ!");
        });
    </script>
</body>
</html>
