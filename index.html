<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Konum ve Takip</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: #e5e3df;
        }
        .panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 280px;
        }
        .badge {
            display: block;
            padding: 5px 8px;
            border-radius: 5px;
            background: #e0e0e0;
            font-weight: bold;
            margin-top: 5px;
            font-size: 12px;
        }
        .layer-switcher {
            margin-top: 8px;
            display: flex;
            gap: 4px;
        }
        .layer-switcher button {
            flex: 1;
            padding: 6px;
            font-size: 11px;
            background: #343a40;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .layer-switcher button:hover { background: #23272b; }
        .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 8px;
        }
        .q-btn {
            background: #e9ecef;
            border: 1px solid #ced4da;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .report-btn {
            width: 100%;
            background: #17a2b8;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
        }
        .report-btn:hover { background: #138496; }
        .sos-btn {
            width: 100%;
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 13px;
        }
        .sos-btn:hover { background: #b02a37; }

        @keyframes emergencyFlash {
            0% { background-color: rgba(220, 53, 69, 0.9); }
            50% { background-color: rgba(255, 255, 255, 0.9); }
            100% { background-color: rgba(220, 53, 69, 0.9); }
        }
