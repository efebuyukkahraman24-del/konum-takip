<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Konum, Pil, Hız, Sohbet ve SOS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        .panel { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            z-index: 1000; 
            background: white; 
            padding: 12px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            width: 260px;
        }
        .badge {
            display: block;
            padding: 4px 8px;
            border-radius: 5px;
            background: #e0e0e0;
            font-weight: bold;
            margin-top: 5px;
            font-size: 13px;
        }
        .chat-box {
            margin-top: 10px;
            border-top: 1px solid #ddd;
            padding-top: 8px;
        }
        .chat-messages {
            max-height: 70px;
            overflow-y: auto;
            font-size: 12px;
            background: #f9f9f9;
            padding: 5px;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .chat-input-area {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 4px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .chat-input-area button {
            padding: 4px 8px;
            font-size: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .sos-btn {
            width: 100%;
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .sos-btn:hover { background: #b02a37; }
        
        @keyframes emergencyFlash {
            0% { background-color: rgba(220, 53, 69, 0.9); }
            50% { background-color: rgba(255, 255, 255, 0.9); }
            100% { background-color: rgba(220, 53, 69, 0.9); }
        }
        .sos-alert-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            animation: emergencyFlash 0.8s infinite;
        }
        .sos-alert-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="panel">
        <h4 id="status" style="margin: 0 0 5px 0;">Konum bekleniyor...</h4>
        <div id="my-battery" class="badge">Piliniz: %--</div>
        <div id="my-speed" class="badge" style="background: #e3f2fd; color: #1565c0;">Hızınız: 0 km/s</div>
        <div id="partner-info" class="badge" style="background: #4caf50; color: white; display: none;">
            Karşı Taraf: Bekleniyor...
        </div>
        
        <div class="chat-box">
            <div id="chat-messages" class="chat-messages">Mesaj yok...</div>
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Mesaj yaz...">
                <button onclick="sendMessage()">Gönder</button>
            </div>
            <button class="sos-btn" onclick="sendSOS()">🚨 SOS ACİL DURUM</button>
        </div>
    </div>

    <div id="sos-overlay" class="sos-alert-overlay" onclick="closeSOS()">
        <div class="sos-alert-box">
            <h2 style="color: #dc3545; margin-top:0;">ACİL DURUM UYARISI!</h2>
            <p>Karşı taraftan acil SOS sinyali alındı!</p>
            <button style="padding: 10px 20px; background: #333; color: white; border: none; border-radius: 5px;">Kapatmak için dokun</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const socket = io();
        const statusEl = document.getElementById('status');
        const myBatteryEl = document.getElementById('my-battery');
        const mySpeedEl = document.getElementById('my-speed');
        const partnerInfoEl = document.getElementById('partner-info');
        const chatMessagesEl = document.getElementById('chat-messages');
        const msgInput = document.getElementById('msg-input');
        const sosOverlay = document.getElementById('sos-overlay');

        const map = L.map('map').setView([41.0082, 28.9784], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let marker = null;
        let myBatteryLevel = "%--";
        let sirenInterval = null;
        let audioCtx = null;

        if ("Notification" in window) {
            Notification.requestPermission();
        }

        function playSirenSound() {
            if (sirenInterval) return;

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                console.log("AudioContext başlatılamadı");
            }

            const playBeep = () => {
                try {
                    if (!audioCtx) return;
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.4);

                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } catch(e) {
                    console.log("Ses çalınamadı:", e);
                }
            };

            playBeep();
            sirenInterval = setInterval(playBeep, 600);
        }

        if (navigator.getBattery) {
            navigator.getBattery().then(battery => {
                const updateBattery = () => {
                    myBatteryLevel = Math.round(battery.level * 100) + "%";
                    if (battery.charging) myBatteryLevel += " ⚡";
                    myBatteryEl.innerText = "Piliniz: " + myBatteryLevel;
                };
                updateBattery();
                battery.addEventListener('levelchange', updateBattery);
                battery.addEventListener('chargingchange', updateBattery);
            });
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                
                let speedKmh = 0;
                if (position.coords.speed !== null && position.coords.speed >= 0) {
                    speedKmh = Math.round(position.coords.speed * 3.6);
                }

                statusEl.innerText = "Konum gönderiliyor...";
                mySpeedEl.innerText = "Hızınız: " + speedKmh + " km/s";
                
                socket.emit('share-location', { 
                    lat: lat, 
                    lng: lng, 
                    battery: myBatteryLevel,
                    speed: speedKmh
                });
            }, (error) => {
                statusEl.innerText = "GPS Hatası: " + error.message;
            }, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            });
        }

        socket.on('update-location', (data) => {
            statusEl.innerText = "Canlı Takip Aktif";
            
            if (data.battery) {
                partnerInfoEl.style.display = "block";
                partnerInfoEl.innerText = `Karşı Taraf | Pil: ${data.battery} | Hız: ${data.speed || 0} km/s`;
            }

            if (marker) {
                marker.setLatLng([data.lat, data.lng]);
            } else {
                marker = L.marker([data.lat, data.lng]).addTo(map).bindPopup("O burada!").openPopup();
            }
            map.setView([data.lat, data.lng], map.getZoom());
        });

        function sendMessage() {
            const text = msgInput.value.trim();
            if(!text) return;
            
            socket.emit('send-message', text);
            chatMessagesEl.innerHTML += `<div><b>Sen:</b> ${text}</div>`;
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
            msgInput.value = "";
        }

        socket.on('receive-message', (text) => {
            chatMessagesEl.innerHTML += `<div><b>O:</b> ${text}</div>`;
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
            
            if (Notification.permission === "granted") {
                new Notification("Yeni Mesaj!", { body: text });
            }
        });

        function sendSOS() {
            if(confirm("Acil durum sinyali göndermek istediğine emin misin?")) {
                socket.emit('send-sos');
                alert("SOS sinyali gönderildi!");
            }
        }

        socket.on('receive-sos', () => {
            sosOverlay.style.display = "flex";
            playSirenSound();

            if (navigator.vibrate) {
                navigator.vibrate([1000, 500, 1000, 500, 1000]);
            }

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("🚨 ACİL DURUM UYARISI!", {
                    body: "Karşı taraf SOS butonuna bastı! Anlık konumuna bak!",
                    requireInteraction: true
                });
            }
        });

        function closeSOS() {
            sosOverlay.style.display = "none";
            if (sirenInterval) {
                clearInterval(sirenInterval);
                sirenInterval = null;
            }
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
        }
    </script>
</body>
</html>
