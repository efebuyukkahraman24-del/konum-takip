<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Konum, Pil, Hız, SOS, Temalar ve Hızlı Durumlar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        .panel { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            z-index: 1000; 
            background: white; 
            padding: 12px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            width: 280px;
        }
        .badge {
            display: block;
            padding: 4px 8px;
            border-radius: 5px;
            background: #e0e0e0;
            font-weight: bold;
            margin-top: 5px;
            font-size: 13px;
        }
        .layer-switcher {
            margin-top: 8px;
            display: flex;
            gap: 4px;
        }
        .layer-switcher button {
            flex: 1;
            padding: 5px;
            font-size: 11px;
            background: #343a40;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .layer-switcher button:hover { background: #23272b; }
        
        /* Hızlı Durum Mesajları Butonları */
        .quick-status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 8px;
        }
        .quick-btn {
            background: #e9ecef;
            border: 1px solid #ced4da;
            padding: 5px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
        }
        .quick-btn:hover { background: #dee2e6; }

        .chat-box {
            margin-top: 8px;
            border-top: 1px solid #ddd;
            padding-top: 6px;
        }
        .chat-messages {
            max-height: 50px;
            overflow-y: auto;
            font-size: 12px;
            background: #f9f9f9;
            padding: 5px;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .chat-input-area {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 4px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .chat-input-area button {
            padding: 4px 8px;
            font-size: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .sos-btn {
            width: 100%;
            background: #dc3545;
            color: white;
            border: none;
            padding: 7px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .sos-btn:hover { background: #b02a37; }
        
        @keyframes emergencyFlash {
            0% { background-color: rgba(220, 53, 69, 0.9); }
            50% { background-color: rgba(255, 255, 255, 0.9); }
            100% { background-color: rgba(220, 53, 69, 0.9); }
        }
        .sos-alert-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            animation: emergencyFlash 0.8s infinite;
        }
        .sos-alert-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="panel">
        <h4 id="status" style="margin: 0 0 5px 0;">Konum bekleniyor...</h4>
        <div id="my-battery" class="badge">Piliniz: %--</div>
        <div id="my-speed" class="badge" style="background: #e3f2fd; color: #1565c0;">Hızınız: 0 km/s</div>
        <div id="partner-info" class="badge" style="background: #4caf50; color: white; display: none;">
            Karşı Taraf: Bekleniyor...
        </div>
        <div id="geofence-status" class="badge" style="background: #fff3cd; color: #856404;">Ev Durumu: Ayarlanıyor...</div>
        
        <div class="layer-switcher">
            <button onclick="setLayer('streets')">Sokak</button>
            <button onclick="setLayer('dark')">Gece</button>
            <button onclick="setLayer('satellite')">Uydu</button>
        </div>

        <!-- Hızlı Durum Butonları -->
        <div class="quick-status-grid">
            <button class="quick-btn" onclick="sendQuickStatus('Yoldayım 🚗')">Yoldayım 🚗</button>
            <button class="quick-btn" onclick="sendQuickStatus('5 dk\'ya oradayım ⏱️')">5 dk'ya oradayım ⏱️</button>
            <button class="quick-btn" onclick="sendQuickStatus('Eve varıyorum 🏠')">Eve varıyorum 🏠</button>
            <button class="quick-btn" onclick="sendQuickStatus('Yemekteyim 🍕')">Yemekteyim 🍕</button>
        </div>

        <div class="chat-box">
            <div id="chat-messages" class="chat-messages">Mesaj yok...</div>
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Mesaj yaz...">
                <button onclick="sendMessage()">Gönder</button>
            </div>
            <button class="sos-btn" onclick="sendSOS()">🚨 SOS ACİL DURUM</button>
        </div>
    </div>

    <div id="sos-overlay" class="sos-alert-overlay" onclick="closeSOS()">
        <div class="sos-alert-box">
            <h2 style="color: #dc3545; margin-top:0;">ACİL DURUM UYARISI!</h2>
            <p>Karşı taraftan acil SOS sinyali alındı!</p>
            <button style="padding: 10px 20px; background: #333; color: white; border: none; border-radius: 5px;">Kapatmak için dokun</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const socket = io();
        const statusEl = document.getElementById('status');
        const myBatteryEl = document.getElementById('my-battery');
        const mySpeedEl = document.getElementById('my-speed');
        const partnerInfoEl = document.getElementById('partner-info');
        const geofenceStatusEl = document.getElementById('geofence-status');
        const chatMessagesEl = document.getElementById('chat-messages');
        const msgInput = document.getElementById('msg-input');
        const sosOverlay = document.getElementById('sos-overlay');

        const map = L.map('map').setView([41.0082, 28.9784], 13);
        
        const layers = {
            streets: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }),
            dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd', attribution: '&copy; CARTO' }),
            satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '&copy; Esri' })
        };

        let currentLayer = layers.streets.addTo(map);

        function setLayer(type) {
            map.removeLayer(currentLayer);
            currentLayer = layers[type].addTo(map);
        }

        let marker = null;
        let homeCircle = null;
        let myBatteryLevel = "%--";
        let sirenInterval = null;
        let audioCtx = null;
        let homeCoords = null; 
        let wasAtHome = true;

        if ("Notification" in window) {
            Notification.requestPermission();
        }

        function playSirenSound() {
            if (sirenInterval) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {}

            const playBeep = () => {
                try {
                    if (!audioCtx) return;
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(4
