<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Konum ve Takip</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: #e5e3df;
        }
        .panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 280px;
        }
        .badge {
            display: block;
            padding: 5px 8px;
            border-radius: 5px;
            background: #e0e0e0;
            font-weight: bold;
            margin-top: 5px;
            font-size: 12px;
        }
        .layer-switcher {
            margin-top: 8px;
            display: flex;
            gap: 4px;
        }
        .layer-switcher button {
            flex: 1;
            padding: 6px;
            font-size: 11px;
            background: #343a40;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .layer-switcher button:hover { background: #23272b; }
        .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 8px;
        }
        .q-btn {
            background: #e9ecef;
            border: 1px solid #ced4da;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .report-btn {
            width: 100%;
            background: #17a2b8;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
        }
        .report-btn:hover { background: #138496; }
        .sos-btn {
            width: 100%;
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 13px;
        }
        .sos-btn:hover { background: #b02a37; }

        @keyframes emergencyFlash {
            0% { background-color: rgba(220, 53, 69, 0.9); }
            50% { background-color: rgba(255, 255, 255, 0.9); }
            100% { background-color: rgba(220, 53, 69, 0.9); }
        }
        .sos-alert-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            animation: emergencyFlash 0.8s infinite;
        }
        .sos-alert-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.6);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            min-width: 260px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel">
        <h4 id="status" style="margin: 0 0 5px 0; color: #d9534f;">GPS İzni Bekleniyor...</h4>
        <div id="my-battery" class="badge">Piliniz: %--</div>
        <div id="my-speed" class="badge" style="background: #e3f2fd; color: #1565c0;">Hızınız: 0 km/s</div>
        <div id="partner-info" class="badge" style="background: #4caf50; color: white; display: none;">Karşı Taraf: Bekleniyor...</div>
        
        <div class="layer-switcher">
            <button onclick="setLayer('streets')">Sokak</button>
            <button onclick="setLayer('dark')">Gece</button>
            <button onclick="setLayer('satellite')">Uydu</button>
        </div>

        <div class="quick-grid">
            <button class="q-btn" onclick="sendMsg('Yoldayım 🚗')">Yoldayım 🚗</button>
            <button class="q-btn" onclick="sendMsg('5 dk\'ya oradayım ⏱️')">5 dk'ya oradayım ⏱️</button>
            <button class="q-btn" onclick="sendMsg('Eve varıyorum 🏠')">Eve varıyorum 🏠</button>
            <button class="q-btn" onclick="sendMsg('Yemekteyim 🍕')">Yemekteyim 🍕</button>
        </div>

        <button class="report-btn" onclick="openReport()">📊 Günlük Özet Raporu</button>

        <div style="margin-top: 8px; border-top: 1px solid #ddd; padding-top: 6px;">
            <div id="chat-box" style="max-height: 45px; overflow-y: auto; font-size: 11px; background: #f9f9f9; padding: 4px; border-radius: 4px; margin-bottom: 5px;">Sohbet boş...</div>
            <div style="display: flex; gap: 4px;">
                <input type="text" id="msg-input" placeholder="Mesaj..." style="flex: 1; padding: 4px; font-size: 11px; border: 1px solid #ccc; border-radius: 3px;">
                <button onclick="sendChat()" style="padding: 4px 8px; background: #007bff; color: white; border: none; border-radius: 3px; font-size: 11px; cursor: pointer;">Gönder</button>
            </div>
        </div>

        <button class="sos-btn" onclick="triggerSOS()">🚨 SOS ACİL DURUM</button>
    </div>

    <div id="sos-overlay" class="sos-alert-overlay" onclick="closeSOS()">
        <div class="sos-alert-box">
            <h2 style="color: #dc3545; margin-top:0;">🚨 ACİL DURUM UYARISI!</h2>
            <p>Karşı taraftan acil SOS sinyali alındı!</p>
            <button style="margin-top: 10px; padding: 10px 20px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer;">Susturmak için dokun</button>
        </div>
    </div>

    <div id="report-overlay" class="modal-overlay" onclick="closeReport()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3 style="color: #17a2b8; margin-top:0;">📊 Günlük Özet Raporu</h3>
            <div style="text-align: left; font-size: 14px; line-height: 1.8;">
                <p style="margin: 5px 0;"><b>Katedilen Toplam Mesafe:</b> <span id="rpt-distance">0 m</span></p>
                <p style="margin: 5px 0;"><b>Ulaşılan Max Hız:</b> <span id="rpt-max-speed">0 km/s</span></p>
                <p style="margin: 5px 0;"><b>Kayıtlı Konum Noktası:</b> <span id="rpt-points">0</span></p>
            </div>
            <button onclick="closeReport()" style="margin-top: 15px; padding: 8px 16px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer;">Kapat</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const socket = io();
        const statusEl = document.getElementById('status');
        const myBatteryEl = document.getElementById('my-battery');
        const mySpeedEl = document.getElementById('my-speed');
        const partnerInfoEl = document.getElementById('partner-info');
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const reportOverlay = document.getElementById('report-overlay');
        const sosOverlay = document.getElementById('sos-overlay');

        const map = L.map('map', { zoomControl: false }).setView([39.9207, 32.8541], 6);
        
        const layers = {
            streets: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }),
            dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd', attribution: '&copy; CARTO' }),
            satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '&copy; Esri' })
        };

        let currentLayer = layers.streets.addTo(map);

        function setLayer(type) {
            map.removeLayer(currentLayer);
            currentLayer = layers[type].addTo(map);
        }

        setInterval(() => { map.invalidateSize(); }, 1000);

        let myMarker = null;
        let partnerMarker = null;
        let lastCoords = null;
        let myBatteryLevel = "%--";
        
        let routePath = [];
        let polyline = L.polyline([], { color: '#007bff', weight: 4, opacity: 0.7 }).addTo(map);
        let totalDistanceMeters = 0;
        let maxSpeedKmh = 0;

        let sirenInterval = null;
        let audioCtx = null;

        function playSirenSound() {
            if (sirenInterval) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {}

            const playBeep = () => {
                try {
                    if (!audioCtx) return;
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } catch(e) {}
            };
            playBeep();
            sirenInterval = setInterval(playBeep, 600);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        if (navigator.getBattery) {
            navigator.getBattery().then(bat => {
                const updateBat = () => {
                    myBatteryLevel = Math.round(bat.level * 100) + "%" + (bat.charging ? " ⚡" : "");
                    myBatteryEl.innerText = "Piliniz: " + myBatteryLevel;
                };
                updateBat();
                bat.addEventListener('levelchange', updateBat);
                bat.addEventListener('chargingchange', updateBat);
            });
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;

                if (speed > maxSpeedKmh) maxSpeedKmh = speed;

                if (lastCoords) {
                    const stepDist = calculateDistance(lastCoords.lat, lastCoords.lng, lat, lng);
                    if (stepDist > 3) {
                        totalDistanceMeters += stepDist;
                    }
                }

                lastCoords = { lat, lng };
                routePath.push([lat, lng]);
                polyline.setLatLngs(routePath);

                statusEl.innerText = "Canlı Takip Aktif 🟢";
                statusEl.style.color = "#28a745";
                mySpeedEl.innerText = "Hızınız: " + speed + " km/s";

                if (!myMarker) {
                    myMarker = L.marker([lat, lng]).addTo(map).bindPopup("Siz").openPopup();
                    map.setView([lat, lng], 15);
                } else {
                    myMarker.setLatLng([lat, lng]);
                }

                socket.emit('share-location', { 
                    lat: lat, 
                    lng: lng, 
                    speed: speed,
                    battery: myBatteryLevel 
                });
            }, err => {
                statusEl.innerText = "GPS İzni Verilmedi!";
                statusEl.style.color = "#dc3545";
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
        }

        // Karşı tarafın verilerini dinle ve pili ekranda göster
        socket.on('update-location', data => {
            partnerInfoEl.style.display = "block";
            const partnerBat = data.battery ? ` | Pil: ${data.battery}` : "";
            partnerInfoEl.innerText = `Karşı Taraf${partnerBat} | Hız: ${data.speed || 0} km/s`;

            if (partnerMarker) {
                partnerMarker.setLatLng([data.lat, data.lng]);
            } else {
                partnerMarker = L.marker([data.lat, data.lng]).addTo(map).bindPopup("Karşı Taraf");
            }
        });

        function openReport() {
            const distStr = totalDistanceMeters >= 1000 
                ? (totalDistanceMeters / 1000).toFixed(2) + " km" 
                : Math.round(totalDistanceMeters) + " metre";
            
            document.getElementById('rpt-distance').innerText = distStr;
            document.getElementById('rpt-max-speed').innerText = maxSpeedKmh + " km/s";
            document.getElementById('rpt-points').innerText = routePath.length;
            
            reportOverlay.style.display = "flex";
        }

        function closeReport() {
            reportOverlay.style.display = "none";
        }

        function sendMsg(txt) {
            socket.emit('send-message', txt);
            chatBox.innerHTML += `<div><b>Sen:</b> ${txt}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendChat() {
            const txt = msgInput.value.trim();
            if (!txt) return;
            sendMsg(txt);
            msgInput.value = "";
        }

        socket.on('receive-message', txt => {
            chatBox.innerHTML += `<div><b>O:</b> ${txt}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        function triggerSOS() {
            if (confirm("Acil durum sinyali göndermek istediğine emin misin?")) {
                socket.emit('send-sos');
                alert("SOS sinyali gönderildi!");
            }
        }

        socket.on('receive-sos', () => {
            sosOverlay.style.display = "flex";
            playSirenSound();
            if (navigator.vibrate) {
                navigator.vibrate([1000, 500, 1000, 500, 1000]);
            }
        });

        function closeSOS() {
            sosOverlay.style.display = "none";
            if (sirenInterval) {
                clearInterval(sirenInterval);
                sirenInterval = null;
            }
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
        }
    </script>
</body>
</html>
